<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI课件协作</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f8fa}
    #workbench{display:block;width:100vw;height:100vh;height:100dvh;border:0}
  </style>
</head>
<body>
  <iframe id="workbench" title="内容协作智能体" src="../../04_原型与说明/AI协作工作台-风格探索/index.html?style=b&amp;page=workspace&amp;revision=D074"></iframe>
  <script>
    const params=new URLSearchParams(location.search);
    const frame=document.getElementById('workbench');
    const destination=new URL(frame.getAttribute('src'),location.href);
    for(const name of ['project','from'])if(params.has(name))destination.searchParams.set(name,params.get(name));
    frame.src=destination.href;
  </script>
</body>
