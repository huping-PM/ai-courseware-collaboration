<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI课件协作平台 · 迭代原型图与说明</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f4;font:14px/1.6 'Microsoft YaHei',Arial,sans-serif;color:#303133}button,input,select{font:inherit}button,a.btn{display:inline-flex;align-items:center;border:1px solid #dcdfe6;background:#fff;color:#606266;padding:5px 12px;border-radius:4px;text-decoration:none;cursor:pointer}button:hover,a.btn:hover{color:#1890ff;border-color:#91caff}aside.index{position:fixed;inset:0 auto 0 0;width:274px;background:#fff;border-right:1px solid #e5e7eb;overflow:auto;padding:20px 14px}h1{font-size:19px;margin:0 0 8px}p.meta{font-size:12px;color:#909399;margin:0 0 16px}#search{width:100%;height:34px;padding:0 10px;border:1px solid #dcdfe6;border-radius:4px;margin-bottom:14px}.group{font-size:12px;color:#909399;margin:16px 8px 6px}.item{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:8px 10px;font-size:13px;margin:2px 0;line-height:1.5}.item.active{background:#e8f4ff;color:#1890ff}.item small{display:block;font-size:11px;color:#909399}.content{margin-left:274px;padding:22px 26px}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.toolbar h2{font-size:18px;margin:0 auto 0 0;font-weight:500}.drawing{display:flex;align-items:flex-start;gap:22px;width:max-content}.screen{width:min(1120px,calc(100vw - 680px));min-width:720px;background:#fff;border:1px solid #dfe4ea;box-shadow:0 2px 12px #23334b0a}.screen img{display:block;width:100%;height:auto}.note{width:340px;flex-shrink:0;padding:22px;background:#fff3b0;color:#252525;border:1px solid #eed98a;min-height:350px;line-height:1.8}.note h3{font-size:16px;margin:0 0 12px}.note h4{font-size:14px;margin:16px 0 4px}.note p{font-size:13px;margin:5px 0}.note .state-meta{border-bottom:1px solid #dccb7a;padding-bottom:12px;margin-bottom:14px;font-size:12px}.note-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;border-top:1px solid #ddcb7b;padding-top:14px}.note-tools button{font-size:11px;padding:3px 7px}.note-body[contenteditable=true]:focus{outline:1px dashed #ac8b16}.foot{margin-top:14px;font-size:12px;color:#909399}a{color:#1890ff}.capture .index,.capture .toolbar,.capture .note-tools,.capture .foot{display:none}.capture .content{margin:0;padding:0}.capture .drawing{gap:20px}.capture .screen{width:1440px;min-width:0;border:0;box-shadow:none}.capture .note{width:400px;min-height:900px;border:0;padding:28px}.capture iframe{display:block;width:1440px;height:900px;border:0}.capture .note p{font-size:14px}.capture .note h4{font-size:16px}
</style></head><body><aside class="index"><h1>迭代原型图</h1><p class="meta">依据功能设计 v0.1 · 待评审<br><span id="count"></span></p><input id="search" placeholder="搜索页面、状态或需求编号"><div id="list"></div></aside><main class="content"><div class="toolbar"><h2 id="title"></h2><button id="prev">上一张</button><button id="next">下一张</button><a class="btn" id="raw" target="_blank">查看原尺寸</a><a class="btn" id="interactive" target="_blank">打开状态画板</a></div><div class="drawing"><div class="screen" id="screen"></div><section class="note"><h3 id="noteTitle"></h3><div class="state-meta" id="stateMeta"></div><div class="note-body" id="notes" contenteditable="true"></div><div class="note-tools"><button id="save">保存本地说明</button><button id="restore">恢复文件默认</button><button id="clear">清除本地草稿</button><button id="download">下载说明HTML</button></div></section></div><p class="foot">图片用于功能与交互评审。媒体素材及状态为演示内容；真实模型、权限及数据持久化仍须研发验证。<a href="../../03_功能设计/AI课件协作平台-迭代功能设计.md">查看功能设计主本</a></p></main><script src="../../04_原型与说明/shared/iteration-boards/core.js"></script><script src="../../04_原型与说明/shared/iteration-boards/workspace.js"></script><script src="../../04_原型与说明/shared/iteration-boards/management.js"></script><script>
const entries=[...(window.WORKSPACE_STATES||[]),...(window.MANAGEMENT_STATES||[])];const params=new URLSearchParams(location.search),capture=params.has('capture');let current=entries.find(x=>x.id===params.get('state'))||entries.find(x=>x.id==='PG19-S01')||entries[0];const board='../../04_原型与说明/shared/iteration-boards/board.html';const labels={PG11:'内容协作智能体',PG13:'项目技能管理',PG18:'全局技能管理',PG19:'任务管理',AUTH:'权限与访问'};const rawName=s=>'原型图/'+s.id+'.png';
function defaults(s){return(s.notes||[]).map((n,i)=>`<h4>${i+1}. ${esc(n.title)}</h4>${(n.items||[]).map((v,j)=>`<p>${String.fromCharCode(97+j)}. ${esc(v)}</p>`).join('')}`).join('');}
function list(){let group='',q=document.querySelector('#search').value.toLowerCase();document.querySelector('#list').innerHTML=entries.filter(x=>(x.id+x.title+x.requirement).toLowerCase().includes(q)).map(s=>{const g=s.id.split('-')[0];let h=g!==group?`<div class="group">${labels[g]}</div>`:'';group=g;return h+`<button class="item${s.id===current.id?' active':''}" data-state="${s.id}">${esc(s.title)}<small>${s.id} · ${esc(s.requirement||'')}</small></button>`}).join('');document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(entries.find(s=>s.id===b.dataset.state)));}
function show(s){current=s;window.reviewState=s.id;const u=new URL(location.href);u.searchParams.set('state',s.id);history.replaceState(null,'',u);document.querySelector('#title').textContent=s.id+' · '+s.title;document.querySelector('#noteTitle').textContent=s.title;document.querySelector('#stateMeta').innerHTML=`<strong>${s.id} · ${esc(s.requirement||'')}</strong><br>触发：${esc(s.trigger||'')}<br>结果：${esc(s.result||'')}`;let saved=null;try{saved=localStorage.getItem('iteration-note:'+s.id)}catch{}document.querySelector('#notes').innerHTML=capture?defaults(s):(saved||defaults(s));document.querySelector('#notes').contentEditable=!capture;const width=s.id==='PG11-S03'?1024:1440;document.querySelector('#screen').innerHTML=capture?`<iframe title="${esc(s.title)}" src="${board}?state=${s.id}" style="width:${width}px"></iframe>`:`<img src="${rawName(s)}" alt="${esc(s.title)}">`;if(capture)document.querySelector('#screen').style.width=width+'px';document.querySelector('#raw').href=rawName(s);document.querySelector('#interactive').href=board+'?state='+s.id;list();}
if(capture)document.body.classList.add('capture');document.querySelector('#count').textContent=entries.length+'个状态画板 · 原型图与图旁说明';document.querySelector('#search').oninput=list;document.querySelector('#prev').onclick=()=>show(entries[(entries.indexOf(current)-1+entries.length)%entries.length]);document.querySelector('#next').onclick=()=>show(entries[(entries.indexOf(current)+1)%entries.length]);document.querySelector('#save').onclick=()=>{localStorage.setItem('iteration-note:'+current.id,document.querySelector('#notes').innerHTML);alert('已保存到本地浏览器');};document.querySelector('#restore').onclick=()=>document.querySelector('#notes').innerHTML=defaults(current);document.querySelector('#clear').onclick=()=>{localStorage.removeItem('iteration-note:'+current.id);document.querySelector('#notes').innerHTML=defaults(current);};document.querySelector('#download').onclick=()=>{const body='<!doctype html><meta charset="utf-8"><title>'+esc(current.title)+'</title><style>body{font:14px/1.8 Microsoft YaHei;max-width:760px;margin:40px auto;background:#fff3b0;padding:30px}h3{font-size:20px}</style><h3>'+esc(current.id+' '+current.title)+'</h3>'+document.querySelector('#stateMeta').outerHTML+document.querySelector('#notes').innerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/html;charset=utf-8'}));a.download=current.id+'-说明.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};show(current);
</script></body></html>
