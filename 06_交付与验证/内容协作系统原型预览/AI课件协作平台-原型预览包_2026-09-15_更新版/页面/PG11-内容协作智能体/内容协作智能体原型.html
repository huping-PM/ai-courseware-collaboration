<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容协作智能体 · 内容协作系统</title><link rel="stylesheet" href="../PG13-智能体配置/base.css"><link rel="stylesheet" href="chat.css"><link rel="stylesheet" href="history-switcher.css"></head><body>
<aside class="sidebar"><div class="brand">内容协作系统</div><div class="project project-name">岗前培训内容项目</div><nav><button class="nav" data-icon="folder" data-route="resource">资源管理</button><button class="nav" id="configMenu" data-icon="settings" aria-expanded="false" aria-controls="configChildren">智能体配置<span class="caret" data-icon="down"></span></button><div id="configChildren" hidden><button class="nav subnav" data-route="skill">技能管理</button><button class="nav subnav" data-route="prompt">提示词管理</button></div><button class="nav active" data-icon="chat" aria-current="page">内容协作智能体</button></nav><div class="side-bottom"><button class="nav" data-icon="settings" disabled>项目设置</button><button class="nav" data-icon="swap" id="switchProject">切换项目</button></div></aside>
<main><header class="top"><button class="icon-button" id="collapse" aria-label="收缩导航" title="收缩导航" aria-expanded="true" data-icon="menu"></button><span class="project-name">岗前培训内容项目</span><span class="crumb-sep">/</span><span>内容协作智能体</span><div class="user"><a href="../../原型预览.html" style="color:#1890ff;text-decoration:none;font-size:12px;margin-right:12px">预览目录</a><span class="avatar" data-icon="user"></span>演示成员甲</div></header>
<section class="chat-workspace" id="workbench"><div id="sessionList" hidden></div><section class="conversation"><header class="chat-head"><div class="session-switcher"><button id="historyChat" class="session-trigger" title="切换历史会话" aria-label="切换历史会话" aria-haspopup="dialog" aria-expanded="false" aria-controls="sessionDropdown"><span id="chatTitle">内容协作智能体</span><span data-icon="down"></span></button><section id="sessionDropdown" role="dialog" aria-label="历史会话筛选" hidden><div class="session-search"><span data-icon="search"></span><input id="sessionSearch" aria-label="搜索历史会话" placeholder="搜索会话名称" autocomplete="off"><button id="clearSessionSearch" class="icon-button" aria-label="清空搜索" data-icon="close" hidden></button></div><div class="session-menu-heading"><span>历史会话</span><span id="sessionMatchCount"></span></div><div id="sessionMatches"></div><div class="session-scope">仅显示当前项目会话</div></section></div><div class="chat-head-actions"><button class="icon-button" id="newChat" title="新建对话" aria-label="新建对话" data-icon="plus"></button></div></header><div class="messages" id="messages" role="log" aria-live="polite"></div><div class="composer"><div id="attachments"></div><textarea id="draft" maxlength="5000" aria-label="制作要求" placeholder="描述制作要求，或提出对当前内容的修改意见…"></textarea><div id="inputError" class="error" role="alert"></div><div class="compose-actions"><div class="model-picker"><button id="modelSelect" type="button" aria-label="选择模型" aria-haspopup="listbox" aria-expanded="false" aria-controls="modelMenu"><span id="modelLabel">qwen3.7-plus</span><span data-icon="down"></span></button><div id="modelMenu" hidden><div class="model-menu-title">选择模型</div><div id="modelOptions" role="listbox" aria-label="可选模型"></div></div></div><div class="pick-actions"><button class="link" data-pick="resource" data-icon="folder">选择资源</button><button class="link" data-pick="skill" data-icon="skill">选择技能</button></div></div></div></section>
<aside class="results" id="results" hidden><header class="result-head"><span>生成内容</span><button class="icon-button" id="closeResults" aria-label="收起成果区" data-icon="close"></button></header><div class="result-select"><select id="resultSelect" aria-label="选择生成内容"></select><div class="muted" id="resultMeta"></div></div><div id="viewer"></div><footer class="result-footer"><button class="primary" id="askResult" data-icon="chat">围绕此内容提问</button></footer></aside></section></main>
<dialog id="picker"><header class="modal-head"><h2 id="pickerTitle"></h2><button class="icon-button" id="pickerClose" aria-label="关闭选择器" data-icon="close"></button></header><div id="pickerBody"></div><footer class="modal-footer"><span class="muted" id="pickedCount"></span><button id="pickerCancel">取消</button><button id="pickerSubmit" class="primary">确定</button></footer></dialog>
<dialog id="confirm"><header class="modal-head"><h2 id="confirmTitle"></h2><button class="icon-button" id="confirmClose" aria-label="关闭确认" data-icon="close"></button></header><div id="confirmBody"></div><footer class="modal-footer" id="confirmFooter"></footer></dialog><div class="toast" role="status" id="toast"></div><script src="chat.js"></script><script src="initial-state.js"></script><script src="history-examples.js"></script><script src="history-switcher.js"></script></body></html>
