-01_技能列表.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=115-1792"}, {"id": "SKILL-02", "name": "SKILL-02 新增技能", "section": "91:1563", "screen": "91:1564", "note": "91:1808", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 82, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 新增技能\na. 技能文件为首项，支持ZIP技能包或skills.md / SKILL.md。\nb. 选择后读取唯一入口的名称、描述，并展示保留的包内文件。\nc. 未选择有效文件前不能提交。", "filename": "SKILL-02_新增技能.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=91-1563"}, {"id": "SKILL-03", "name": "SKILL-03 文件读取后自动填充", "section": "115:1993", "screen": "115:1994", "note": "115:2238", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 82, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 技能包上传\na. 文件为第一项；ZIP内识别唯一 skills.md，兼容 SKILL.md。\nb. 名称、描述由元信息填入，可继续修改。\n2. 附件保留\na. 显示入口路径及包内全部文件，保留脚本与相对目录。\nb. 提交成功保存原包及附件，上传不执行脚本。", "filename": "SKILL-03_文件读取后自动填充.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=115-1993"}, {"id": "SKILL-04", "name": "SKILL-04 文件校验失败", "section": "117:1762", "screen": "117:1763", "note": "117:2009", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 83, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 解析失败\na. 缺失或多个技能入口、加密、损坏、超限时阻止提交。\nb. 展示具体原因，用户重选文件后重试。\nc. 不把压缩包中的脚本作为可执行操作。", "filename": "SKILL-04_文件校验失败.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=117-1762"}, {"id": "SKILL-05", "name": "SKILL-05 技能解析中", "section": "91:1810", "screen": "91:1811", "note": "91:2009", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 68, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 解析中\na. 提交后显示解析中，防止重复提交。\nb. 解析期间禁止编辑、启停及删除，完成后更新为启用或解析失败。", "filename": "SKILL-05_技能解析中.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=91-1810"}, {"id": "SKILL-06", "name": "SKILL-06 技能详情", "section": "117:2011", "screen": "117:2012", "note": "117:2253", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 83, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 查看技能包\na. 展示技能说明正文和包内文件路径。\nb. 可下载原始压缩包或单个文件，字节与上传内容一致。\nc. 文件只读查看，不在此执行脚本。", "filename": "SKILL-06_技能详情.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=117-2011"}, {"id": "SKILL-07", "name": "SKILL-07 编辑技能", "section": "91:2011", "screen": "91:2012", "note": "91:2256", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 82, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 编辑技能\na. 回填已保存名称、描述、原包及附件。\nb. 不替换文件则全部保留；替换后重新解析并填充。\nc. 解析或保存失败不覆盖已保存版本，保留表单便于修正。", "filename": "SKILL-07_编辑技能.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=91-2011"}, {"id": "SKILL-08", "name": "SKILL-08 未保存关闭保护", "section": "92:1514", "screen": "92:1515", "note": "92:1774", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 86, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 关闭保护\na. 表单有修改时确认是否放弃。\nb. 取消放弃继续编辑；确认放弃不保存。", "filename": "SKILL-08_未保存关闭保护.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=92-1514"}, {"id": "SKILL-09", "name": "SKILL-09 停用确认", "section": "92:1776", "screen": "92:1777", "note": "92:1994", "page": "89:549", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 73, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 停用技能\na. 确认对象及影响后停用，取消保持启用。\nb. 停用不改变历史成果。", "filename": "SKILL-09_停用确认.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=92-1776"}, {"id": "SKILL-10", "name": "SKILL-10 启用确认", "section": "92:1996", "screen": "92:1997", "note": "92:2214", "page": "89:549", "width": 1920, "height": 1080, "note  智能体配置通过左侧菜单展开技能管理和提示词管理。\n2. 提示词状态\na. 草稿未发布版本显示“—”，已发布展示当前版本。", "filename": "PROMPT-01_提示词列表.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=117-2255"}, {"id": "PROMPT-02", "name": "PROMPT-02 新增提示词", "section": "117:2506", "screen": "117:2507", "note": "117:2798", "page": "89:550", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 101, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 新增提示词\na. 维护名称、类型、正文；名称必填1—50字，类型必选，正文必填且最多10000字。\nb. 可保存草稿或发布，取消不保存。", "filename": "PROMPT-02_新增提示词.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=117-2506"}, {"id": "PROMPT-03", "name": "PROMPT-03 编辑草稿", "section": "117:2800", "screen": "117:2801", "note": "117:3092", "page": "89:550", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 101, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 编辑草稿\na. 回填已保存内容，可继续保存草稿或发布。\nb. 保存草稿不产生发布版本。", "filename": "PROMPT-03_编辑草稿.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=117-2800"}, {"id": "PROMPT-04", "name": "PROMPT-04 编辑已发布提示词", "section": "117:4257", "screen": "117:4258", "note": "117:4550", "page": "89:550", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 101, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 编辑已发布提示词\na. 修改后通过发布新版本生效，不覆盖历史版本快照。\nb. 取消保持原发布内容。", "filename": "PROMPT-04_编辑已发布提示词.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=117-4257"}, {"id": "PROMPT-05", "name": "PROMPT-05 发布确认", "section": "117:4552", "screen": "117:4553", "note": "117:4867", "page": "89:550", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 107, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 发布确认\na. 表单校验后打开确认框，更新备注必填，最多200字。\nb. 取消确认回到编辑表单并保留内容。", "filename": "PROMPT-05_发布确认.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=117-4552"}, {"i ": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 当前模型\na. 模型选择随会话保存，用于后续请求。\nb. 生成中禁止切换；重试沿用原请求模型。", "filename": "PG11-I02_模型已切换.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-790"}, {"id": "PG11-I03", "name": "PG11-I03 资源选择", "section": "118:903", "screen": "118:904", "note": "118:1016", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 35, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 选择资源\na. 展示当前项目可用资源，可按类型和名称筛选并跨类型多选。\nb. 确定才回填草稿依据，取消不应用临时选择。", "filename": "PG11-I03_资源选择.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-903"}, {"id": "PG11-I04", "name": "PG11-I04 资源已勾选", "section": "118:1049", "screen": "118:1050", "note": "118:1164", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 35, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 临时选择\na. 勾选后更新数量与勾选状态，可再次取消。\nb. 确定回填，取消不修改原草稿。", "filename": "PG11-I04_资源已勾选.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-1049"}, {"id": "PG11-I05", "name": "PG11-I05 依据已回填", "section": "118:1197", "screen": "118:1198", "note": "118:1304", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 25, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 草稿依据\na. 确定后显示资源标签，允许移除或查看完整名称。\nb. 仅选择依据不发送请求，须填写制作要求。", "filename": "PG11-I05_依据已回填.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-1197"}, {"id": "PG11-I06", "name": "PG11-I06 制作要求已填写", "section": "118:1337", "screen": "118:1338", "note": "118:1444", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 25, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 制作要求\na. 示例要求仅填入草稿，由用户确认提交。\nb. Enter发送，Shift+Enter换行，中文输入法选词时不发送。", "filename": "PG11-I06_制作要求已填写.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-1337"}, {"id": "PG11-I07", "name": "PG11-I07 选择技能", "section": "119:1063", "screen": "119:1064", "note": "119:1207", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 35, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 选择技能\na. 仅列当前项目可用技能，可按名称查询并多选。\nb. 确定回填草稿标签；取消不提交本次选择。", "filename": "PG11-I07_选择技能.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=119-1063"}, {"id": "PG11-I08", "name": "PG11-I08 依据失效", "section": "119:1209", "screen": "119:1210", "note": "119:1347", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 26, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 依据校验\na. 发送前检查所选资源、技能是否有效；失效时标记并阻止发送。\nb. 保留制作要求，移除或重选后再提交。", "filename": "PG11-I08_依据失效.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=119-1209"}, {"id": "PG11-I09", "name": "PG11-I09 首次提交生成中", "section": "119:1351", "screen": "119:1352", "note": "119:1489", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 28, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 提交要求\na. 发送后记录用户文字、依据和模型，清空已发送草稿。\nb. 显示处理中，不使用虚假进度；禁止重复发送和切换模型。", "filename": "PG11-I09_首次提交生成中.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=119-1351"}, {"id": "PG11-I10", "name": "PG11-I10 需要补充信息", "section": "119:1496", "screen": "119:1497", "note": "119:1607", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 23, "instances": 1, "fonts": ["Noto Sans SC"], "noteText": "1. 补充信息\na. 信息不足时在对话中提出具体问题，用户补充后继续。\nb. 保持上下文及适用依据，不跳转固定多步骤制作页。", "filename": "PG11-I10_需要补充信息.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=119-1496"}, {"id": "PG11-C01", "name": "PG11-C01 协作状态·文档", "section": "118:1477", "screen": "118:1478", "note": "118:1732", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 71, "instances": 3, "fonts": ["Noto Sans SC"], "noteText": "1. 文档画布\na. 点击清单或消息查看入口，展示同一文档并高亮清单项。\nb. 文档只读展示标题、段落和列表。\n2. 持续协作\na. 围绕当前成果反馈后新增修改稿，原稿保留。\nb. 完成成果可手动保存至资源库。", "filename": "PG11-C01_协作状态·文档.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-1477"}, {"id": "PG11-C02", "name": "PG11-C02 协作状态·图片", "section": "118:1781", "screen": "118:1782", "note": "118:2004", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 59, "instances": 4, "fonts": ["Noto Sans SC"], "noteText": "1. 图片画布\na. 展示所选完整图片，可缩小、放大、适应画布及全屏。\nb. 缩放范围25%—200%，点击比例恢复100%。", "filename": "PG11-C02_协作状态·图片.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-1781"}, {"id": "PG11-C03", "name": "PG11-C03 协作状态·视频", "section": "118:2061", "screen": "118:2062", "note": "118:2291", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 61, "instances": 4, "fonts": ["Noto Sans SC"], "noteText": "1. 视频画布\na. 默认不自动播放，提供播放、暂停、进度、音量控制。\nb. 切换内容或离开预览时停止播放；生成中或失败内容不可播放。", "filename": "PG11-C03_协作状态·视频.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-2061"}, {"id": "PG11-C04", "name": "PG11-C04 历史会话筛选", "section": "118:2348", "screen": "118:2349", "note": "118:2661", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 85, "instances": 3, "fonts": ["Noto Sans SC"], "noteText": "1. 会话任务列表\na. 左侧按名称搜索与状态筛选，每项仅名称及右侧状态图标。\nb. 切换保留各任务草稿、模型、依据及成果。\nc. 不同任务支持并发，完成回写所属任务，不打断当前查看。", "filename": "PG11-C04_历史会话筛选.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-2348"}, {"id": "PG11-C05", "name": "PG11-C05 保存至资源库", "section": "118:2710", "screen": "118:2711", "note": "118:2999", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 80, "instances": 3, "fonts": ["Noto Sans SC"], "noteText": "1. 保存表单\na. 项目只读，类型由成果确定；名称带真实扩展名，最多100字。\nb. 分类按当前项目对应类型树形选择，最多5级，选定展示完整路径。\n2. 保存结果\na. 用户主动保存，成功后显示已保存；取消不入库，失败保留输入。", "filename": "PG11-C05_保存至资源库.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-2710"}, {"id": "PG11-C06", "name": "PG11-C06 保存成功", "section": "118:3048", "screen": "118:3049", "note": "118:3306", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 72, "instances": 3, "fonts": ["Noto Sans SC"], "noteText": "1. 保存成功\na. 当前成果显示已保存并禁止重复提交，保留聊天、画布和清单。\nb. 在同项目资源管理对应类型与分类下可查询、预览该文件。\nc. 新生成的修改稿可独立保存。", "filename": "PG11-C06_保存成功.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=118-3048"}, {"id": "PG11-C07", "name": "PG11-C07 待人工确认", "section": "119:1614", "screen": "119:1615", "note": "119:1916", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 68, "instances": 3, "fonts": ["Noto Sans SC"], "noteText": "1. 人工确认\na. 展示待确认文档，用户查看后确认继续或直接提出修改意见。\nb. 确认形成可见消息再推进，不以生成成功替代人工确认。", "filename": "PG11-C07_待人工确认.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=119-1614"}, {"id": "PG11-C08", "name": "PG11-C08 视频生成中", "section": "119:1921", "screen": "119:1922", "note": "119:2223", "page": "89:551", "width": 1920, "height": 1080, "noteX": 1988, "screenRight": 1960, "textCount": 72, "instances": 3, "fonts": ["Noto Sans SC"], "noteText": "1. 多任务并发\na. 不同会话可同时执行，同一任务执行中禁止重复提交。\nb. 列表实时回写执行状态，后台完成不打断当前查看。\n2. 成果归属\na. 消息、文件、模型与成果按项目和任务绑定。\nb. 待确认与执行失败不能标记为已完成。", "filename": "PG11-C08_视频生成中.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=119-1921"}, {"id": "PG11-C09", "name": "PG11-C09 视频生成失败", "section": "122:1265", "screen": "122:1266", "note": "122:1567", "page": "89:551", "width": 1518, "height": 720, "noteX": 1586, "screenRight": 1558, "textCount": 73, "instances": 3, "fonts": ["Noto Sans SC"], "noteText": "1. 生成失败\na. 失败项展示原因和重试入口，已成功内容保留。\nb. 重试沿用原模型 : 1920, "height": 1080, "noteText": "1. 确认完成\na. 文件作为本地附件显示在当前草稿，不自动发送。\nb. 已选入库文件可在当前项目资源库查看，未勾选文件仅作会话依据。\nc. 移除草稿附件不删除已入库文件。", "filename": "PG11-U03_本地附件已回填.png", "figmaUrl": "https://www.figma.com/design/EjC3IegY9kqwAAmg5M5mrR?node-id=154-2014", "noteX": 1988, "screenRight": 1960}];let filter='all';const grid=document.getElementById('grid');function render(){const q=document.getElementById('search').value.trim().toLowerCase();const items=states.filter(s=>(filter==='all'||s.id.startsWith(filter))&&s.name.toLowerCase().includes(q));grid.replaceChildren();document.getElementById('total').textContent='显示 '+items.length+' 个状态';for(const s of items){const a=document.createElement('article'),im=document.createElement('img'),sec=document.createElement('section'),h=document.createElement('h2'),links=document.createElement('div'),fig=document.createElement('a'),png=document.createElement('a');im.src='效果图/'+s.filename;im.alt=s.name;im.loading='lazy';im.onclick=()=>{zoomtitle.textContent=s.name;zoomimg.src=im.src;zoom.showModal()};h.textContent=s.name;links.className='links';fig.href=s.figmaUrl;fig.target='_blank';fig.rel='noopener';fig.textContent='在 Figma 查看 ↗';png.href=im.src;png.target='_blank';png.textContent='打开原尺寸图片';links.append(fig,png);sec.append(h,links);a.append(im,sec);grid.append(a)}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('search').oninput=render;render();
