.map-wrap{scrollbar-width:none;-ms-overflow-style:none}.map-wrap::-webkit-scrollbar{display:none;width:0;height:0}.example-gallery{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.example-button img{width:100%;height:180px;object-fit:contain}.comparison-grid{display:flex;align-items:flex-start;gap:20px;overflow:auto}.comparison-grid figure{flex:1 0 220px}.comparison-grid img{height:min(66vh,700px);max-width:none;width:auto;display:block;margin:0 auto 10px}.image-dialog{width:min(900px,95vw)}.node.root{overflow-wrap:anywhere}.map-wrap:focus-visible{outline:2px solid var(--accent)}@media(max-width:650px){.comparison-grid{flex-direction:column}.comparison-grid figure{flex:auto;width:100%}.comparison-grid img{max-width:100%;height:auto;max-height:70vh}}</style></head><body><header><div><div class="eyebrow">PRODUCT · DISCUSSION</div><h1>__TITLE__</h1><p>__SUBTITLE__</p></div><div class="date"><strong>开放方案导图</strong><br>__DATE__</div></header><nav aria-label="导图工具"><button class="control" id="mapBtn" aria-pressed="true">思维导图</button><button class="control" id="allBtn" aria-pressed="false">展开全文</button><button class="control" id="collapseBtn">收起全文</button><span class="hint">先看核心问题，再讨论方案或协同模块；右侧查看详情</span></nav><main><div class="layout" id="layout"><div class="map-wrap" tabindex="0" aria-label="可滚动导图区域"><div class="map" id="map" aria-label="产品方案思维导图"></div></div><div id="paneResizer" role="separator" tabindex="0" aria-label="调整导图与说明宽度" aria-orientation="vertical" aria-controls="detail" title="按住左右拖动调整宽度；双击恢复默认"></div><aside id="detail" aria-live="polite"></aside></div><div class="reader" id="reader" hidden></div></main><footer class="status" id="status"></footer><dialog id="imageDialog" class="image-dialog" aria-labelledby="imageTitle"><header><h2 id="imageTitle"></h2><button id="closeImage" class="close-image" aria-label="关闭效果图">关闭 ×</button></header><div id="imageBody"></div><footer>概念效果图 · 非最终界面<a id="fullBoard" target="_blank" rel="noopener">查看完整方案对比图 ↗</a></footer></dialog><script>
const config=__CONFIG__;
const data=config.groups;
let selected=0,selectedSection=0,selectedTopic=0;
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rich(s){return esc(s).replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,(_,label,url)=>'<a target="_blank" rel="noopener" href="'+url+'">'+label+'</a>');}
function label(t){return esc(t.title.replace('【推荐】',''))+(t.recommended?'<span class="tag">推荐</span>':'')+(t.priority?'<span class="tag priority priority-'+t.priority+'">'+['','1','2','3'][t.priority]+'</span>':'');}
function items(t){return t.items.map(x=>'<li'+(/^(优点|劣势|选择理由|推荐原因)：/.test(x)?' class="assessment"':'')+'>'+rich(x)+(x.startsWith('产品形态：')?previews(t):'')+'</li>').join('');}
function current(){return data[selected].sections[selectedSection].topics[selectedTopic];}
function detail(){const g=data[selected],s=g.sections[selectedSection],t=current();let body='<div class="crumb">'+esc(g.title)+' / '+esc(s.title)+'</div><h2>'+label(t)+'</h2><ul>'+items(t)+'</ul>';if(t.modules)body+='<h3>核心功能模块</h3><div class="module-summaries">'+t.modules.map(m=>'<section class="module-summary"><h4>'+esc(m.title)+'</h4><p>'+m.items.map(rich).join(' ')+'</p></section>').join('')+'</div>';body+='<div class="panel-foot">候选方向与功能，非已确认开发范围。<br>'+(s.structure==='modules'?'阅读顺序：核心问题 → 协同功能模块。':s.structure==='conditional'?'阅读顺序：核心问题 → 不同条件下的处理方式。':'阅读顺序：核心问题 → 方案 → 推荐结论。')+'</div>';$('detail').innerHTML=body;$('detail').scrollTop=0;}
function draw(){const map=$('map');map.replaceChildren();const g=data[selected],s=g.sections[selectedSection];const height=Math.max(760,s.topics.length*72+70),mid=height/2;map.style.height=height+'px';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width','950');svg.setAttribute('height',height);map.append(svg);
function line(x1,y1,x2,y2,active){const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d','M '+x1+' '+y1+' C '+((x1+x2)/2)+' '+y1+', '+((x1+x2)/2)+' '+y2+', '+x2+' '+y2);p.setAttribute('fill','none');p.setAttribute('stroke',active?'#b56d39':'#c4cfc0');p.setAttribute('stroke-width',active?'2':'1');svg.append(p);}
function node(cls,x,y,text,fn){const b=document.createElement(fn?'button':'div');b.className='node '+cls;b.style.left=x+'px';b.style.top=y+'px';b.innerHTML=text;if(fn){b.onclick=fn;b.setAttribute('aria-pressed',String(cls.includes('selected')));}map.append(b);return b;}
node('root',10,mid-60,esc(config.rootTitle||'产品方案')+'<small>方案讨论</small>');
data.forEach((v,i)=>{const y=mid-((data.length-1)*106)/2-30+i*106;line(122,mid,163,y+30,i===selected);node('category'+(i===selected?' selected':''),163,y,'<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+esc(v.title)+'<small>'+esc(v.subtitle)+'</small>',()=>{selected=i;selectedSection=0;selectedTopic=0;draw();detail();document.querySelector('.map-wrap').scrollLeft=0;});});
const start=mid-g.sections.length*78/2;
g.sections.forEach((v,i)=>{const y=start+i*78;line(333,mid-((data.length-1)*106)/2+selected*106,375,y+25,i===selectedSection);node('section'+(i===selectedSection?' selected':''),375,y,esc(v.title.split('｜')[0]),()=>{selectedSection=i;selectedTopic=0;draw();detail();document.querySelector('.map-wrap').scrollLeft=0;});});
const ts=s.topics,tstart=mid-ts.length*72/2;
ts.forEach((v,j)=>{const y=tstart+j*72;line(605,start+selectedSection*78+25,655,y+24,j===selectedTopic);node('topic'+(j===selectedTopic?' selected':'')+(v.recommended?' recommended':''),655,y,label(v),()=>{selectedTopic=j;draw();detail();document.querySelector('.map-wrap').scrollLeft=0;});});
}
function moduleText(m){return '<h5>功能模块｜'+esc(m.title)+'</h5><p class="module-description">'+m.items.map(rich).join('<br>')+'</p>';}
function reader(query='',open=true){const q=query.trim().toLowerCase();let count=0,body='<p>方案选择类按核心问题、候选方案、推荐结论阅读；机构专区与机构督学按核心问题、协同功能模块阅读。</p>';data.forEach(g=>{let block='';g.sections.forEach(s=>{const titleMatch=(g.title+' '+s.title).toLowerCase().includes(q),topics=s.topics.filter(t=>!q||titleMatch||(t.title+' '+t.items.join(' ')+' '+(t.modules||[]).map(m=>m.title+' '+m.items.join(' ')).join(' ')).toLowerCase().includes(q));if(!topics.length)return;count++;block+='<details '+(open?'open':'')+'><summary>'+esc(s.title)+'</summary><div class="sub">'+topics.map(t=>'<h4>'+label(t)+'</h4><ul>'+items(t)+'</ul>'+(t.modules||[]).map(moduleText).join('')).join('')+'</div></details>';});if(block)body+='<section><h2>'+esc(g.title)+'</h2><p class="group-description">'+esc(g.subtitle)+'</p>'+block+'</section>';});$('reader').innerHTML=count?body:'<p class="empty">没有匹配的方案，请尝试其他关键词。</p>';}
function mode(isMap){$('layout').hidden=!isMap;$('reader').hidden=isMap;$('mapBtn').setAttribute('aria-pressed',String(isMap));$('allBtn').setAttribute('aria-pressed',String(!isMap));}


function previews(t){if(!t.images?.length)return '';return '<div class="example-gallery">'+t.images.map((im,i)=>'<button class="example-button" data-gallery="'+esc(JSON.stringify(t.images))+'" aria-haspopup="dialog"><img src="'+esc(im.src)+'" alt="'+esc(im.title)+'"><span><strong>'+esc(im.title)+'</strong><small>点击查看'+(t.images.length>1?'全部版本':'完整效果图')+'</small></span></button>').join('')+'</div>';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-gallery]');if(!b)return;const images=JSON.parse(b.dataset.gallery);$('imageDialog').classList.toggle('compare-images',images.length>1);$('imageTitle').textContent=images.length>1?'产品形态 · 多图对比':images[0].title;$('fullBoard').hidden=true;$('imageBody').innerHTML='<div class="comparison-grid">'+images.map(im=>'<figure><figcaption>'+esc(im.title)+'</figcaption><img src="'+esc(im.src)+'" alt="'+esc(im.title)+'"><a href="'+esc(im.src)+'" target="_blank" rel="noopener">查看原图 ↗</a></figure>').join('')+'</div>';$('imageDialog').showModal();$('imageDialog').scrollTop=0;});
$('closeImage').onclick=()=>$('imageDialog').close();
$('imageDialog').addEventListener('click',e=>{if(e.target!==$('imageDialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();});
const sections=data.flatMap(g=>g.sections),topics=sections.flatMap(s=>s.topics);$('status').textContent=data.length+' 个方向 · '+sections.length+' 个议题 · '+topics.length+' 个讨论节点';
$('mapBtn').onclick=()=>mode(true);$('allBtn').onclick=()=>{reader();mode(false)};$('collapseBtn').onclick=()=>{reader('',false);mode(false)};draw();detail();reader();

</script><script>
(()=>{
 const layout=document.getElementById('layout'),handle=document.getElementById('paneResizer');
 const wide=matchMedia('(min-width:1051px)');let ratio=.68,active=null;
 function setWidth(px){
  if(!wide.matches||layout.hidden)return;
  const width=layout.getBoundingClientRect().width;if(!width)return;
  const min=320,max=width-12-280,left=Math.min(max,Math.max(min,px));
  ratio=left/width;layout.style.setProperty('--map-width',left+'px');
  handle.setAttribute('aria-valuemin',Math.round(min/width*100));handle.setAttribute('aria-valuemax',Math.round(max/width*100));handle.setAttribute('aria-valuenow',Math.round(ratio*100));
  handle.setAttribute('aria-valuetext','导图宽度 '+Math.round(ratio*100)+'%');
 }
 function reset(){ratio=.68;setWidth(layout.getBoundingClientRect().width*ratio);}
 handle.addEventListener('pointerdown',e=>{if(e.button!==0||!wide.matches)return;e.preventDefault();active=e.pointerId;handle.setPointerCapture(active);document.body.classList.add('resizing-panes');handle.focus();});
 handle.addEventListener('pointermove',e=>{if(e.pointerId===active)setWidth(e.clientX-layout.getBoundingClientRect().left-6);});
 function finish(e){if(e.pointerId!==active)return;active=null;document.body.classList.remove('resizing-panes');}
 handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);handle.addEventListener('lostpointercapture',finish);
 handle.addEventListener('dblclick',reset);
 handle.addEventListener('keydown',e=>{let delta=e.shiftKey?80:20;const width=layout.getBoundingClientRect().width;
  if(e.key==='ArrowLeft')setWidth(width*ratio-delta);else if(e.key==='ArrowRight')setWidth(width*ratio+delta);else if(e.key==='Home')setWidth(320);else if(e.key==='End')setWidth(width-292);else return;e.preventDefault();});
 new ResizeObserver(()=>setWidth(layout.getBoundingClientRect().width*ratio)).observe(layout);
 reset();
})();
</script></body></html>
