<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课件编辑器 · 原型与说明</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#303133;font:14px/1.6 "Microsoft YaHei",sans-serif}.review-bar{padding:14px 24px;background:white;display:flex;gap:12px;align-items:center;border-bottom:1px solid #dcdfe6;position:sticky;top:0;z-index:2;min-width:1300px}.review-bar strong{font-size:17px;margin-right:8px}.review-bar small{color:#909399}.review-bar button,.review-bar select,.review-bar a{height:32px;border:1px solid #dcdfe6;border-radius:4px;background:white;padding:4px 10px;color:#606266;text-decoration:none;cursor:pointer;font:inherit}.review-bar button:hover,.review-bar a:hover{color:#1890ff;border-color:#1890ff}.review-bar select{width:250px}.review-bar .grow{flex:1}.surface{display:flex;gap:24px;align-items:flex-start;width:max-content;padding:24px}.screen{width:1440px;height:900px;border:0;background:white;box-shadow:0 2px 10px #0001}.note{width:380px;min-height:560px;background:#fff4ba;padding:28px 30px;color:#272622;box-shadow:0 2px 10px #0001}.note h2{font-size:20px;margin:0 0 22px}.note-body h3{font-size:17px;margin:25px 0 10px;font-weight:600}.note-body p{font-size:15px;line-height:1.9;margin:8px 0}.note-body:focus{outline:1px dashed #c7aa54}.note-footer{border-top:1px solid #decd91;margin-top:24px;padding-top:12px;color:#7d7048;font-size:12px}.draft-status{font-size:12px;color:#67768b;min-width:75px}.capture .review-bar{display:none}.capture .surface{padding:0;gap:24px}.capture .screen{width:1920px;height:1080px}.capture .note{width:408px;min-height:1080px;box-shadow:none}.capture .note-footer{display:none}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #1890ff;outline-offset:2px}
</style></head><body>
<header class="review-bar"><strong>课件编辑器</strong><small>待评审 · 交互演示</small><button id="prev" aria-label="上一状态">上一张</button><select id="stateSelect" aria-label="选择原型状态"></select><button id="next" aria-label="下一状态">下一张</button><a id="full" target="_blank">打开原型</a><span class="grow"></span><button id="saveNotes">保存说明草稿</button><button id="restoreNotes">恢复默认</button><button id="clearNotes">清除本地草稿</button><button id="downloadNotes">下载图文HTML</button><span id="draftStatus" class="draft-status" role="status"></span></header>
<div class="surface" id="surface"><iframe id="screen" class="screen" title="课件编辑器交互原型"></iframe><aside class="note"><h2 id="noteTitle"></h2><div id="noteBody" class="note-body" contenteditable="true" aria-label="图旁需求说明"></div><div class="note-footer">正文来源：课件编辑器-原型说明.md。此处编辑仅存为本地草稿，不会改写需求主本。</div></aside></div>
<script src="notes-data.js"></script><script>
const entries=window.EDITOR_NOTES;const byId=Object.fromEntries(entries.map(e=>[e.id,e]));const params=new URLSearchParams(location.search);const capture=params.has('capture');if(capture)document.body.classList.add('capture');const select=document.getElementById('stateSelect'),frame=document.getElementById('screen'),body=document.getElementById('noteBody'),status=document.getElementById('draftStatus');let current=byId[params.get('state')]?params.get('state'):'overview';
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function format(s){return s.split('\n').filter(Boolean).map(line=>/^\d+\./.test(line)?'<h3>'+escapeHtml(line)+'</h3>':'<p>'+escapeHtml(line)+'</p>').join('');}
function key(){return 'course-editor-notes-v1-'+current;}
function showNotes(id){if(!byId[id])return;current=id;select.value=id;const e=byId[id];document.getElementById('noteTitle').textContent=e.number+' '+e.title;let text=e.body;try{if(!capture)text=localStorage.getItem(key())||text;}catch{}body.innerHTML=format(text);body.contentEditable=String(!capture);document.getElementById('full').href='editor.html?state='+id;status.textContent='';window.reviewState=id;}
function navigate(id){showNotes(id);frame.src='editor.html?state='+encodeURIComponent(id);const u=new URL(location.href);u.searchParams.set('state',id);history.replaceState(null,'',u);}
entries.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.number+' '+e.title;select.append(o);});select.onchange=()=>navigate(select.value);document.getElementById('prev').onclick=()=>navigate(entries[(entries.findIndex(e=>e.id===current)+entries.length-1)%entries.length].id);document.getElementById('next').onclick=()=>navigate(entries[(entries.findIndex(e=>e.id===current)+1)%entries.length].id);
window.addEventListener('message',ev=>{if(ev.source===frame.contentWindow&&ev.data?.type==='editor-state'&&byId[ev.data.state]&&current!==ev.data.state)showNotes(ev.data.state);});
document.getElementById('saveNotes').onclick=()=>{try{localStorage.setItem(key(),body.innerText);status.textContent='草稿已保存';}catch{status.textContent='保存失败';}};document.getElementById('restoreNotes').onclick=()=>{body.innerHTML=format(byId[current].body);status.textContent='已恢复默认';};document.getElementById('clearNotes').onclick=()=>{try{localStorage.removeItem(key());}catch{}body.innerHTML=format(byId[current].body);status.textContent='本地草稿已清除';};
document.getElementById('downloadNotes').onclick=async()=>{const e=byId[current];try{const url='../../../06_交付与验证/课件编辑器原型预览/原型图/'+e.number+'-'+e.title+'.png';const res=await fetch(url);if(!res.ok)throw Error();const blob=await res.blob();const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});const html='<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>'+escapeHtml(e.title)+'</title><style>body{margin:24px;font:15px/1.8 Microsoft YaHei;display:flex;gap:24px;align-items:flex-start;background:#eef1f5}img{width:1440px}aside{background:#fff4ba;padding:30px;width:360px;flex-shrink:0}h3{font-size:17px}h2{font-size:20px}</style><img alt="'+escapeHtml(e.title)+'" src="'+data+'"><aside><h2>'+escapeHtml(e.number+' '+e.title)+'</h2>'+format(body.innerText)+'</aside></html>';const link=document.createElement('a');const objectUrl=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));link.href=objectUrl;link.download=e.number+'-'+e.title+'-图文说明.html';link.click();setTimeout(()=>URL.revokeObjectURL(objectUrl),3000);status.textContent='已下载HTML';}catch{status.textContent='请通过本地预览服务下载';}};
navigate(current);
</script></body></html>
