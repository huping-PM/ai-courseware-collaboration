<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课件编辑器</title><link rel="stylesheet" href="../../PG13-智能体配置/base.css"><link rel="stylesheet" href="editor.css"></head><body>
<aside class="sidebar" id="sidebar"><div class="brand">内容协作系统</div><div class="project">岗前培训内容项目</div><button class="nav"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>资源管理</span></button><button class="nav"><svg class="icon" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0-5v2m0 14v2M3 12h2m14 0h2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>智能体配置</span></button><div class="nav-sub"><button>技能</button><button>提示词</button></div><button class="nav active"><svg class="icon" viewBox="0 0 24 24"><path d="m12 3 2.2 6.8H21l-5.5 4 2.1 6.6-5.6-4-5.6 4 2.1-6.6-5.5-4h6.8z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>内容协作智能体</span></button><div class="side-bottom"><button class="nav"><svg class="icon" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>项目设置</span></button><button class="nav"><svg class="icon" viewBox="0 0 24 24"><path d="M7 7h10l-3-3m3 3-3 3M17 17H7l3 3m-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>切换项目</span></button></div></aside>
<main><header class="system-top"><button id="collapse" class="icon-button" aria-label="收缩导航"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><span>岗前培训内容项目</span><i>/</i><span>内容协作智能体</span><span class="user">王晓琳 <span class="avatar">王</span></span></header><header class="editor-top"><div class="crumb">课件编辑器</div><input id="projectName" value="有效沟通：从倾听到确认" aria-label="工程名称"><span id="saveState" class="save-state">已保存</span><div class="top-actions"><button id="saveBtn" data-action="save">保存</button><button id="undoBtn" class="icon-button" aria-label="撤销" title="撤销"><svg class="icon" viewBox="0 0 24 24"><path d="M9 8 5 12l4 4M6 12h8a4 4 0 1 1 0 8" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><button id="redoBtn" class="icon-button" aria-label="重做" title="重做"><svg class="icon" viewBox="0 0 24 24"><path d="m15 8 4 4-4 4m3-4h-8a4 4 0 1 0 0 8" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><button id="historyBtn">历史版本</button><button id="aiBtn">AI 修改</button><button id="exportBtn" class="primary">导出视频</button></div></header>
<section class="workspace" id="workspace"><aside class="scene-panel"><div class="panel-title">场景 <span id="duration">33 秒</span></div><div id="scenes" class="scene-list"></div><div class="scene-actions"><button id="addScene">新增场景</button><button id="copyScene" aria-label="复制场景"><svg class="icon" viewBox="0 0 24 24"><path d="M9 8V5h10v12h-3M5 9h10v10H5z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><button id="deleteScene" aria-label="删除场景"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14m-9 4v5m4-5v5M9 7l1-2h4l1 2m-8 0 1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div></aside>
<section class="stage-area"><div class="stage-toolbar"><span id="sceneLabel">场景 2 · 三步沟通</span><div><button id="playBtn" class="icon-button" aria-label="播放预览"><svg class="icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor"/></svg></button><button id="fitBtn">适应画布</button></div></div><div class="canvas-wrap"><div id="canvas" class="lesson-canvas" tabindex="0"><div class="course-mark">沟通方法</div><h1 id="titleEl" data-element="title">三步沟通，让信息准确抵达</h1><p id="subEl" data-element="subtitle">先理解，再确认，最后形成可执行的行动</p><div class="flow"><button class="flow-step active" data-element="listen"><b>01</b><span>倾听</span><small>先听完整信息</small></button><i></i><button class="flow-step" data-element="clarify"><b>02</b><span>澄清</span><small>确认关键事实</small></button><i></i><button class="flow-step" data-element="confirm"><b>03</b><span>确认</span><small>约定下一步行动</small></button></div><div class="canvas-foot">有效沟通训练 · 第 2 场景</div></div></div></section>
<aside class="property-panel"><div class="panel-title">属性与图层</div><div id="selectionHint" class="selection-hint">已选中：标题文字</div><div class="form-block"><label>文字内容<textarea id="textContent" rows="3"></textarea></label><label>字号 <div class="range-row"><input id="fontSize" type="range" min="20" max="52" value="34"><output id="fontOutput">34 px</output></div></label><label>颜色 <div class="color-row"><input id="fontColor" type="color" value="#1f3b5b"><code id="colorCode">#1F3B5B</code></div></label></div><div class="layers"><div class="layer-title">图层</div><button class="layer selected" data-element="title"><svg class="icon" viewBox="0 0 24 24"><path d="M6 5h12M12 5v14m-5 0h10" fill="none" stroke="currentColor" stroke-width="2"/></svg>标题文字 <em></em></button><button class="layer" data-element="listen"><svg class="icon" viewBox="0 0 24 24"><path d="m12 4 8 8-8 8-8-8z" fill="none" stroke="currentColor" stroke-width="2"/></svg>三步流程图 <em></em></button><button class="layer" data-element="subtitle"><svg class="icon" viewBox="0 0 24 24"><path d="M6 5h12M12 5v14m-5 0h10" fill="none" stroke="currentColor" stroke-width="2"/></svg>说明文字 <em></em></button></div><label class="lock-row"><input id="lockToggle" type="checkbox"> 锁定当前对象 <small>锁定后不可修改</small></label><label>动画<select id="animation"><option>淡入 · 0.4 秒</option><option>从下出现 · 0.5 秒</option><option>重点强调 · 0.6 秒</option></select></label></aside></section>
<section class="timeline"><div class="timeline-head"><b>时间轴</b><span>当前场景 18 秒</span><div class="time-scale">0s　　3s　　6s　　9s　　12s　　15s　　18s</div></div><div class="track"><b>场景</b><div class="clip scene-clip">三步沟通</div></div><div class="track"><b>配音</b><div class="clip voice-clip">“沟通的关键，不是表达得多，而是确认彼此理解一致。”</div><button class="edit-track" data-track="voice">编辑</button></div><div class="track"><b>字幕</b><div class="clip caption-clip">先理解，再确认，最后形成可执行的行动</div><button class="edit-track" data-track="caption">编辑</button></div></section></main>
<aside id="aiDrawer" class="ai-drawer" aria-label="AI 修改面板"><header><h2>AI 修改</h2><button class="icon-button" id="closeAi" aria-label="关闭"><svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></header><div class="ai-target"><b>修改目标</b><span id="aiTarget">场景 2 · 标题文字</span></div><label>修改要求<textarea id="aiInput" placeholder="例如：将标题改得更有行动感，保留原意。"></textarea></label><div id="aiResult" class="ai-result"></div></aside>
<dialog id="modal"><header class="modal-head"><h2 id="modalTitle"></h2><button class="icon-button" id="modalClose" aria-label="关闭"><svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></header><div id="modalBody"></div><footer id="modalFooter" class="modal-footer"></footer></dialog><div id="toast" class="toast"></div><script src="editor.js"></script></body></html>
